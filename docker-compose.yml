services:
  db:
    image: postgres:16-alpine
    container_name: grx_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-grx_db}
      POSTGRES_USER: ${POSTGRES_USER:-grx_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-grx_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-grx_user} -d ${POSTGRES_DB:-grx_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: grx_web
    restart: always
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      - media_volume:/app/media
    ports:
      - "8000:8000"
    environment:
      - DJANGO_DEBUG=True
      - DATABASE_URL=postgres://${POSTGRES_USER:-grx_user}:${POSTGRES_PASSWORD:-grx_password}@db:5432/${POSTGRES_DB:-grx_db}
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0,web
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-grx-parfums-insecure-dev-key-change-in-production-123456789}
      - STRIPE_PUBLIC_KEY=${STRIPE_PUBLIC_KEY}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - SITE_URL=${SITE_URL:-http://localhost:8000}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  media_volume:
